version: "3.9"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pokemon_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  auth-server:
    build:
      context: .
      dockerfile: auth_server/Dockerfile
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - AUTH_SERVER_URL=http://auth-server:8000
      - JWT_KEYS_DIR=/app/keys
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - jwt_keys:/app/keys
    networks:
      - pokemon_net

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - AUTH_SERVER_URL=http://auth-server:8000
      - API_AUTH_ENABLED=true
    ports:
      - "8888:8888"  # MCP HTTP server
      - "8001:8001"  # FastAPI server
    depends_on:
      - auth-server
    networks:
      - pokemon_net
    command: python main.py --transport http --port 8888 --auth

volumes:
  dbdata:
  jwt_keys:

networks:
  pokemon_net:
    driver: bridge
